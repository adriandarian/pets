        * {
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          color: #1d2523;
          font-family: "IBM Plex Mono", monospace;
        }

        .scene-fill {
          position: absolute;
          inset: 0;
          background-color: #f5f1e8;
          background-image: radial-gradient(circle at 74% 52%, rgba(230, 106, 78, 0.17), rgba(230, 106, 78, 0) 38%);

        .scene-content {

          z-index: 3;

          gap: 72px;
          width: 100%;
          height: 100%;
          padding: 88px 94px 76px;
        }

        .copy {
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 25px;
          min-width: 0;
        }

        .instruction-step {
          display: flex;
          align-items: center;
          gap: 18px;
          width: 100%;
          padding: 20px 22px;
          border: 3px solid #d8d0c2;
          border-radius: 24px;
          background: #fffdf8;
          box-shadow: 0 12px 0 rgba(29, 37, 35, 0.06);
          will-change: transform, opacity;
        }

        .instruction-step.primary {
          border-color: #1d2523;
        }

        .instruction-step.confirm {
          border-color: #2f8a64;
          background: #eef7f1;
        }

        .step-number {
          display: grid;
          flex: 0 0 58px;
          width: 58px;
          height: 58px;
          place-items: center;
          border: 3px solid #1d2523;
          border-radius: 17px;
          background: #e66a4e;
          font-size: 27px;
          font-weight: 700;
        }

        .instruction-step.confirm .step-number {
          border-color: #1d5f47;
          background: #bfe4d0;
          color: #174b39;
        }

        .step-copy {
          min-width: 0;
        }

        .step-kicker {
          display: block;
          margin-bottom: 7px;
          color: #5d6763;
          font-size: 19px;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .step-title {
          display: block;
          font-family: "Archivo Black", sans-serif;
          font-size: 38px;
          font-weight: 400;
          line-height: 1.05;
          letter-spacing: -0.025em;
        }

        .helper {
          max-width: 520px;
          margin: 5px 0 0;
          color: #5d6763;
          font-size: 24px;
          line-height: 1.45;
        }

        .progress {
          display: flex;
          gap: 10px;
          margin-top: 18px;
        }

        .progress-segment {
          width: 82px;
          height: 10px;
          border-radius: 999px;
          background: #d8d0c2;
        }

        .progress-segment.active {
          background: #e66a4e;
        }

        .progress-segment.done {
          background: #2f8a64;
        }

        .visual {
          position: relative;
          min-width: 0;
          height: 100%;
        }

        .stage-glow {
          position: absolute;
          left: 30px;
          top: 60px;
          width: 1010px;
          height: 790px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(230, 106, 78, 0.24), rgba(230, 106, 78, 0) 70%);

        .finder-backplate {

        .traffic-light.green {

          font-weight: 400;

        }

        .dialog-top {
          display: grid;
          grid-template-columns: 92px minmax(0, 1fr);
          gap: 26px;
          align-items: center;
        }

        .dialog-icon {
          position: relative;
          width: 88px;
          height: 88px;
          border: 4px solid #1d2523;
          border-radius: 24px;
          background: #e66a4e;
          will-change: transform, opacity;
        }

        .dialog-icon::before,
        .dialog-icon::after {
          position: absolute;
          top: 18px;
          width: 25px;
          height: 28px;
          background: #fff2df;
          clip-path: polygon(50% 0, 100% 100%, 0 100%);
          content: "";
        }

        .dialog-icon::before {
          left: 15px;
          transform: rotate(-8deg);
        }

        .dialog-icon::after {
          right: 15px;
          transform: rotate(8deg);
        }

        .dialog-title {
          margin: 0 0 10px;
          font-family: "Archivo Black", sans-serif;
          font-size: 31px;
          font-weight: 400;
          line-height: 1.13;
          letter-spacing: -0.02em;
        }

        .dialog-body {
          margin: 0;
          color: #5d6763;
          font-size: 20px;
          line-height: 1.42;
        }

        .dialog-actions {
          display: flex;
          justify-content: flex-end;
          gap: 14px;
          margin-top: 30px;
        }

        .dialog-button {

          min-width: 150px;
          padding: 14px 24px;
          overflow: hidden;
          border: 3px solid #1d2523;
          border-radius: 16px;

          color: #1d2523;
          font-family: "IBM Plex Mono", monospace;
          font-size: 20px;
          font-weight: 700;
          text-align: center;
          will-change: transform;
        }

        .dialog-button.open {

          color: #fffdf8;
        }

        .button-check {
          position: absolute;
          right: 8px;
          top: 8px;
          display: grid;
          width: 27px;
          height: 27px;
          place-items: center;
          border-radius: 50%;
          background: #bfe4d0;
          color: #174b39;
          font-size: 17px;
          font-weight: 700;
          will-change: transform, opacity;
        }

        .cursor {
          position: absolute;
          left: 0;
          top: 0;
          z-index: 12;
          width: 104px;
          height: 104px;
          pointer-events: none;
          transform-origin: 15px 10px;
          filter: drop-shadow(0 6px 8px rgba(29, 37, 35, 0.34));
          will-change: transform, opacity;
        }

        .cursor svg {
          display: block;
          width: 100%;
          height: 100%;
          fill: #fffdf8;
          stroke: #1d2523;
          stroke-width: 1.4;
          stroke-linejoin: round;
        }

        .ripple {
          position: absolute;
          left: -36px;
          top: -36px;
          width: 72px;
          height: 72px;
          border: 5px solid #e66a4e;
          border-radius: 50%;
          opacity: 0;
          transform-origin: center;
          will-change: transform, opacity;
        }
